    <text x="44" y="236" fill="#9DB0C8" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">ENROLL</text>
    <text x="44" y="268" fill="#E3EAF4" font-family="Segoe UI, Helvetica, sans-serif" font-size="22">wazuh-authd</text>
