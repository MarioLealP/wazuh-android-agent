  </g>
  <line x1="48" y1="320" x2="48" y2="364" stroke="#3595F2" stroke-width="1.5"/>
  <text x="64" y="348" fill="#5AABF5" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1.2">AES &#183; 1514</text>
  <g>
    <rect x="24" y="368" width="312" height="120" fill="#102744" stroke="#22395A"/>
