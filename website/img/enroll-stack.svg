  </g>
  <line x1="48" y1="148" x2="48" y2="192" stroke="#3595F2" stroke-width="1.5"/>
  <text x="64" y="176" fill="#5AABF5" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1.2">TLS &#183; 1515</text>
  <g>
