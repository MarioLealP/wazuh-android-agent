# Our fork's CI (Gitea only, not sent upstream): unit tests and a debug build on every push and PR.
# Pushes to master also build the release APK signed with our key and keep it as the run's artifact.
# The phone only runs APKs from this job.
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned Android command-line tools; the sha1 is from Google's repository2-3.xml.
  CMDLINE_TOOLS_ZIP: commandlinetools-linux-16111833_latest.zip
  CMDLINE_TOOLS_SHA1: e025545c62a8e64c7559119566a569fb1dec5f60
  ANDROID_PACKAGES: "platforms;android-35 build-tools;35.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
          echo "$CMDLINE_TOOLS_SHA1  $RUNNER_TEMP/clt.zip" | sha1sum -c -
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          mv "$RUNNER_TEMP/clt/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          sdkmanager="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          # shellcheck disable=SC2086 # the package list splits on spaces on purpose
          "$sdkmanager" $ANDROID_PACKAGES > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon :protocol:test :app:testDebugUnitTest

      - name: Debug build
        if: github.ref != 'refs/heads/master' || github.event_name != 'push'
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Signed release build
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.WAZUH_AGENT_KEYSTORE_B64 }}
          WAZUH_AGENT_STORE_PASSWORD: ${{ secrets.WAZUH_AGENT_STORE_PASSWORD }}
          WAZUH_AGENT_KEY_PASSWORD: ${{ secrets.WAZUH_AGENT_KEY_PASSWORD }}
          WAZUH_AGENT_KEY_ALIAS: release
          # The certificate the phone's installed copy is signed with; any other signer fails the job.
          EXPECTED_CERT_SHA256: ${{ vars.WAZUH_AGENT_CERT_SHA256 }}
        run: |
          export WAZUH_AGENT_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$WAZUH_AGENT_STORE_FILE"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_B64" | base64 -d > "$WAZUH_AGENT_STORE_FILE")
          ./gradlew --no-daemon :app:assembleRelease
          apk=$(ls app/build/outputs/apk/release/*.apk)
          signer=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "signer: $signer"
          test -n "$EXPECTED_CERT_SHA256" && test "$signer" = "$EXPECTED_CERT_SHA256"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wazuh-agent-${{ github.sha }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
